}

/* ---------- Exercise picker (custom dropdown) ---------- */
function ExercisePicker({ id, value, onChange, onPick, index, muscle, placeholder }) {
  const [open, setOpen] = useState(false);
  const [showAll, setShowAll] = useState(false);
  const [pos, setPos] = useState({ up:false, maxH:260 });
  const ref = useRef();
  const q = norm(value);

  // Open upward when the keyboard leaves little room below the field
  useEffect(() => {
    if (!open) return;
    const vv = window.visualViewport;
    const calc = () => {
      const el = ref.current; if (!el) return;
      const r = el.getBoundingClientRect();
      const vTop = vv ? vv.offsetTop : 0, vBottom = vv ? vv.offsetTop + vv.height : window.innerHeight;
      const below = vBottom - r.bottom - 12, above = r.top - vTop - 12;
      const up = below < 240 && above > below;
      setPos({ up, maxH: Math.max(140, Math.min(300, up ? above : below)) });
    };
    calc();
    if (vv) { vv.addEventListener('resize', calc); vv.addEventListener('scroll', calc); }
    return () => { if (vv) { vv.removeEventListener('resize', calc); vv.removeEventListener('scroll', calc); } };
  }, [open]);

  const { list, hidden } = useMemo(() => {
    const widen = !!q || showAll || !muscle;
    const inM = o => !muscle || o.muscle === muscle;
    const opts = index.filter(o => (!q || norm(o.name).includes(q)) && (widen || inM(o)));
    const hiddenCount = widen ? 0 : index.filter(o => !inM(o)).length;
    opts.sort((a, b) => {
      const pa = q && norm(a.name).startsWith(q) ? 0 : 1, pb = q && norm(b.name).startsWith(q) ? 0 : 1;
      if (pa !== pb) return pa - pb;
      if (muscle) { const ma = inM(a) ? 0 : 1, mb = inM(b) ? 0 : 1; if (ma !== mb) return ma - mb; }
      const ha = a.count > 0 ? 0 : 1, hb = b.count > 0 ? 0 : 1;
      if (ha !== hb) return ha - hb;
      if (a.lastDate !== b.lastDate) return a.lastDate < b.lastDate ? 1 : -1;
      if (a.count !== b.count) return b.count - a.count;
      return a.name.localeCompare(b.name);
    });
    return { list: opts.slice(0, 40), hidden: hiddenCount };
  }, [index, q, showAll, muscle]);

  const exact = index.some(o => norm(o.name) === q);
  const choose = o => {
    if (onPick) onPick(o); else onChange(o.name);
    setOpen(false); setShowAll(false);
    if (ref.current) ref.current.blur();
  };

  return (
    <div className="picker">
      <input id={id} ref={ref} className="in" value={value} placeholder={placeholder}
        autoCapitalize="words" autoCorrect="off" autoComplete="off" role="combobox" aria-expanded={open}
        onFocus={() => setOpen(true)}
        onBlur={() => setTimeout(() => setOpen(false), 180)}
        onChange={e => { onChange(e.target.value); setOpen(true); }}/>
      {open && (list.length > 0 || (q && !exact)) && (
        <div className={'pick-list' + (pos.up ? ' up' : '')} style={{maxHeight:pos.maxH}} onMouseDown={e => e.preventDefault()}>
          {list.map(o => (
            <button type="button" key={o.name} className="pick-opt" onClick={() => choose(o)}>
              <span className="pn">{o.name}</span>
              <span className="pm">{o.muscle}{o.last ? ` · last ${o.last.map(rowText).join(', ')} · ${short(o.lastDate)}` : ' · suggested'}</span>
            </button>
          ))}
          {q && !exact && (
            <button type="button" className="pick-opt new" onClick={() => choose({ name:value.trim(), muscle:null, last:null, count:0 })}>
              <span className="pn">Use “{value.trim()}” as a new exercise</span>
            </button>
          )}
          {hidden > 0 && (
            <button type="button" className="pick-opt more" onClick={() => setShowAll(true)}>
              <span className="pn">Show {hidden} from other muscles</span>
            </button>
          )}
        </div>
      )}
    </div>
  );
}

/* ---------- Edit an existing entry ---------- */
function EditSheet({ entry, entries, unit, toast, onSave, onDelete, onClose }) {
  const [f, setF] = useState({
    date: entry.date, muscle: entry.muscle, exercise: entry.exercise,
    sets: String(entry.sets), reps: String(entry.reps), weight: entry.weight ? String(entry.weight) : '', perSide: entry.mult === 2,
  });
  const index = useMemo(() => buildIndex(entries), [entries]);
  const set = p => setF(x => ({ ...x, ...p }));
  const step = unit === 'kg' ? 2.5 : 5;

  useEffect(() => { document.body.style.overflow = 'hidden'; return () => { document.body.style.overflow = ''; }; }, []);

  const save = () => {
    const sets = parseFloat(f.sets), reps = parseFloat(f.reps), weight = parseFloat(f.weight) || 0;
    const exercise = f.exercise.trim();
    if (!exercise) return toast('Enter an exercise name');
    if (!(sets > 0) || !(reps > 0)) return toast('Sets and reps must be above 0');
    onSave({ ...entry, date:f.date, muscle:f.muscle, exercise, sets, reps, weight, mult: f.perSide ? 2 : 1 });
  };

  return (
    <div className="overlay" role="dialog" aria-label="Edit entry">
      <div className="ov-in">
        <h1 style={{marginBottom:14}}>Edit entry</h1>
        <div className="card">
          <div className="field">
            <label className="f" htmlFor="ed-date">Date</label>
            <input id="ed-date" type="date" className="in" value={f.date} max={addDays(today(), 1)} onChange={e => e.target.value && set({ date:e.target.value })}/>
          </div>
          <div className="field">
            <label className="f">Muscle</label>
            <div className="chips" role="group" aria-label="Muscle">
              {MUSCLES.map(m => (
                <button key={m.id} type="button" className={'chip' + (f.muscle === m.id ? ' on' : '')} onClick={() => set({ muscle:m.id })} aria-pressed={f.muscle === m.id}>
                  <span className="dot" style={{background:m.color}}/>{m.id}
                </button>
              ))}
            </div>
          </div>
          <div className="field">
            <label className="f" htmlFor="ed-ex">Exercise</label>
            <ExercisePicker id="ed-ex" value={f.exercise} onChange={v => set({ exercise:v })}
              onPick={o => set({ exercise:o.name, ...(o.muscle ? { muscle:o.muscle } : {}) })}
              index={index} muscle={f.muscle} placeholder="Exercise name"/>
          </div>
          <div className="grid3">
            <Stepper label="Sets" value={f.sets} onChange={v => set({ sets:v })} step={1}/>
            <Stepper label="Reps" value={f.reps} onChange={v => set({ reps:v })} step={1}/>
            <Stepper label={`Weight (${unit})`} value={f.weight} onChange={v => set({ weight:v })} step={step}/>
          </div>
          <div style={{marginTop:14}}>
            <button type="button" className={'chip' + (f.perSide ? ' on' : '')} aria-pressed={f.perSide} onClick={() => set({ perSide: !f.perSide })}>Per side ×2</button>
          </div>
        </div>
      </div>
      <div className="ov-foot">
        <div className="inner">
          <button className="ghost danger" onClick={() => { if (confirm('Delete this entry?')) onDelete(entry.id); }}>Delete</button>
          <button className="ghost" onClick={onClose}>Cancel</button>
          <button className="primary" onClick={save}>Save</button>
        </div>
      </div>
    </div>
  );
}

/* ---------- Screenshot import ---------- */
const MUSCLE_RULES = [
  [/tricep|pushdown|push down|skull|\bdips?\b|close[- ]grip/, 'Triceps'],
  [/calf|calves/, 'Calves'],
  [/glute|kickback|hip thrust|abductor|abduction/, 'Glutes'],
  [/adductor|adduction/, 'Quads'],
  [/leg curl|hamstring|romanian|\brdl\b|stiff[- ]leg|good morning/, 'Hamstrings'],
  [/leg press|leg extension|squat|lunge|hack|quad|step[- ]up/, 'Quads'],
  [/back extension|hyperextension/, 'Back'],
  [/bicep|curl/, 'Biceps'],
  [/crunch|\babs?\b|\bcore\b|plank|sit[- ]?up|leg raise|oblique|twist|woodchop/, 'Core'],
  [/shoulder|overhead|military|arnold|lateral|rear delt|front raise|face pull|upright|delt/, 'Shoulders'],
  [/\brows?\b|pull[- ]?down|pull[- ]?up|chin[- ]?up|\blat\b|deadlift|shrug|\bback\b|pullover/, 'Back'],
  [/chest|bench|\bfly|flye|\bpec|push[- ]?up|press|incline|decline/, 'Chest'],
];
function guessMuscle(name, entries) {
  const n = name.trim().toLowerCase();
  if (!n) return '';
  const hit = entries.find(e => e.exercise.toLowerCase() === n);
  if (hit) return hit.muscle;
  for (const [re, m] of MUSCLE_RULES) if (re.test(n)) return m;
  return '';
}

// "8 reps x 347 lb" (weight part optional, tolerant of OCR slips like "Ib" for "lb")
const SET_RE = /(\d{1,3})\s*reps?\b(?:\s*[x×*]\s*(\d{1,4}(?:[.,]\d+)?)\s*(lbs?|ibs?|1bs?|kgs?)?)?/i;
const cleanName = t => t.replace(/[^A-Za-z0-9()\-'\/ ]+/g, ' ').replace(/\s+/g, ' ').trim();

const loadTesseract = () => window.Tesseract ? Promise.resolve(window.Tesseract) :
  new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
    s.onload = () => window.Tesseract ? res(window.Tesseract) : rej(new Error('OCR engine missing'));
    s.onerror = () => rej(new Error('Could not load OCR engine'));
    document.head.appendChild(s);
  });

// Grayscale, and invert dark-mode screenshots so text is dark on light (OCR reads that better)
async function prepImage(file) {
  let bmp;
  try { bmp = await createImageBitmap(file); }
  catch (e) {
    bmp = await new Promise((res, rej) => { const img = new Image(); img.onload = () => res(img); img.onerror = rej; img.src = URL.createObjectURL(file); });
  }
  const k = Math.min(1, 3200 / Math.max(bmp.width, bmp.height));
  const w = Math.round(bmp.width * k), h = Math.round(bmp.height * k);
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const ctx = c.getContext('2d'); ctx.drawImage(bmp, 0, 0, w, h);
  const img = ctx.getImageData(0, 0, w, h), d = img.data; let sum = 0;
  for (let i = 0; i < d.length; i += 4) { const g = d[i]*0.299 + d[i+1]*0.587 + d[i+2]*0.114; d[i] = d[i+1] = d[i+2] = g; sum += g; }
  if (sum / (w*h) < 128) for (let i = 0; i < d.length; i += 4) { d[i] = d[i+1] = d[i+2] = 255 - d[i]; }
  ctx.putImageData(img, 0, 0);
  return c;
}

function getLines(data) {
  let ls = data.lines;
  if (!ls || !ls.length) { ls = []; (data.blocks || []).forEach(b => (b.paragraphs || []).forEach(p => (p.lines || []).forEach(l => ls.push(l)))); }
  const out = ls.filter(l => l.bbox).map(l => ({ text:(l.text || '').trim(), x0:l.bbox.x0, y0:l.bbox.y0 })).filter(l => l.text);
  if (out.length) return { lines: out.sort((a,b) => a.y0 - b.y0), geom: true };
  return { lines: (data.text || '').split('\n').map((t,i) => ({ text:t.trim(), x0:0, y0:i })).filter(l => l.text), geom: false };
}

const monIdx = s => MON.findIndex(x => x.toLowerCase() === s.slice(0, 3).toLowerCase());
const mkDate = (y, m, d) => { const dt = new Date(y, m, d); return dt.getFullYear() === y && dt.getMonth() === m && dt.getDate() === d ? toStr(dt) : null; };
const MONRE = '(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)';

// Finds a workout date such as "Oct 3, 2026", "3 Oct 2026", "2026-10-03", "10/3/2026" or "Oct 3"
function parseDateLine(t) {
  let m = t.match(new RegExp('\\b' + MONRE + '[a-z]*\\.?\\s+(\\d{1,2})(?:st|nd|rd|th)?,?\\s+(20\\d{2})\\b', 'i'));
  if (m) return mkDate(+m[3], monIdx(m[1]), +m[2]);
  m = t.match(new RegExp('\\b(\\d{1,2})\\s+' + MONRE + '[a-z]*\\.?,?\\s+(20\\d{2})\\b', 'i'));
  if (m) return mkDate(+m[3], monIdx(m[2]), +m[1]);
  m = t.match(/\b(20\d{2})-(\d{2})-(\d{2})\b/);
  if (m) return mkDate(+m[1], +m[2] - 1, +m[3]);
  m = t.match(/\b(\d{1,2})\/(\d{1,2})\/(20\d{2})\b/);
  if (m) return mkDate(+m[3], +m[1] - 1, +m[2]);
  m = t.match(new RegExp('\\b' + MONRE + '[a-z]{0,6}\\.?\\s+(\\d{1,2})(?:st|nd|rd|th)?\\b(?!\\s*(?:reps?|lbs?|kg|x|×|sets?))'));
  if (m) {
    const now = new Date(); let d = mkDate(now.getFullYear(), monIdx(m[1]), +m[2]);
    if (d && d > addDays(today(), 1)) d = mkDate(now.getFullYear() - 1, monIdx(m[1]), +m[2]);
    return d;
  }
  return null;
}

const perSideFor = (name, entries) => { const ls = lastSession(entries, name); return !!ls && ls.rows[0].mult === 2; };

// Turns parsed exercises into the editable review model
function finishSession(name, date, unit, text, exs, entries) {
  return {
    id: uid(), name, date, unit, text,
    exercises: exs.filter(e => e.rows.length).map(e => {
      const dup = e.name && entries.some(x => x.date === date && norm(x.exercise) === norm(e.name));
      return {
        id: e.id, name: e.name, muscle: guessMuscle(e.name, entries), perSide: perSideFor(e.name, entries), include: !dup,
        rows: e.rows.map(r => ({ id:r.id, sets:String(r.sets), reps:String(r.reps), weight: r.weight ? String(r.weight) : '' })),
      };
    }),
  };
}

// OCR route (image scan)
function buildSession(name, data, width, entries) {
  const text = data.text || '';
  const { lines, geom } = getLines(data);
  const xs = lines.filter(l => SET_RE.test(l.text)).map(l => l.x0).sort((a, b) => a - b);
  const mx = xs.length ? xs[Math.floor(xs.length / 2)] : 0;
  const tol = width * 0.06;
  const isName = l => !SET_RE.test(l.text) && (!geom || Math.abs(l.x0 - mx) <= tol) &&
    (l.text.match(/[A-Za-z]/g) || []).length >= 3 && !/exercise/i.test(l.text);

  const exs = []; let cur = null; let unitSeen = null;
  for (const l of lines) {
    const m = l.text.match(SET_RE);
    if (m) {
      if (!cur) { cur = { id:uid(), name:'', rows:[] }; exs.push(cur); }
      const reps = +m[1], weight = m[2] ? parseFloat(m[2].replace(',', '.')) : 0;
      if (m[3] && !unitSeen) unitSeen = /kg/i.test(m[3]) ? 'kg' : 'lb';
      const last = cur.rows[cur.rows.length - 1];
      if (last && last.reps === reps && last.weight === weight) last.sets++;
      else cur.rows.push({ id:uid(), sets:1, reps, weight });
    } else if (isName(l)) {
      if (cur && cur.rows.length === 0) cur.name = cleanName(l.text);
      else { cur = { id:uid(), name:cleanName(l.text), rows:[] }; exs.push(cur); }
    }
  }
  return finishSession(name, parseDateLine(text) || today(), unitSeen, text, exs, entries);
}

/* ---- Pasted text route (iOS Live Text: touch and hold text in Photos, Select All, Copy) ---- */
// "8 reps x 347 lb" (weight optional), "347 lb x 8" or "8 x 347 lb"
const SET_G = /(\d{1,3})\s*reps?\b(?:\s*[x×*]\s*(\d{1,4}(?:[.,]\d+)?)\s*(lbs?|ibs?|1bs?|kgs?)?)?|(\d{1,4}(?:[.,]\d+)?)\s*(lbs?|kgs?)\s*[x×*]\s*(\d{1,3})\b|(\d{1,3})\s*[x×]\s*(\d{1,4}(?:[.,]\d+)?)\s*(lbs?|kgs?)\b/gi;
const setCount = e => e.rows.reduce((n, r) => n + r.sets, 0);
const isNameText = n => {
  const letters = (n.match(/[A-Za-z]/g) || []).length;
  return letters >= 3 && letters / n.length >= 0.6 && !/exercises?\b/i.test(n) &&
    !/^(workout|sets?|reps?|notes?|edit|done|share|add|back|save|finish|history|today)$/i.test(n);
};
// Consecutive repeats of the same exercise (a screenshot boundary) keep the more complete one
function dedupeAdjacent(exs) {
  const out = [];
  exs.forEach(e => {
    const p = out[out.length - 1];
    if (p && e.name && norm(p.name) === norm(e.name)) { if (setCount(e) > setCount(p)) out[out.length - 1] = e; }
    else out.push(e);
  });
  return out;
}

function parseText(text, entries) {
  const sessions = []; let cur = null;
  const start = date => { cur = { date, exs:[], unit:null, lines:[], ex:null }; sessions.push(cur); };
  const newEx = name => { if (!cur) start(today()); cur.ex = { id:uid(), name, rows:[] }; cur.exs.push(cur.ex); };
  const addName = t => {
    const n = cleanName(t);
    if (!isNameText(n)) return;
    if (!cur) start(today());
    if (cur.ex && cur.ex.rows.length === 0) cur.ex.name = n; else newEx(n);
  };
  const addSet = m => {
    if (!cur) start(today());
    if (!cur.ex) newEx('');
    let reps, wRaw, u;
    if (m[1] !== undefined) { reps = +m[1]; wRaw = m[2]; u = m[3]; }
    else if (m[4] !== undefined) { reps = +m[6]; wRaw = m[4]; u = m[5]; }
    else { reps = +m[7]; wRaw = m[8]; u = m[9]; }
    const weight = wRaw ? parseFloat(wRaw.replace(',', '.')) : 0;
    if (u && !cur.unit) cur.unit = /kg/i.test(u) ? 'kg' : 'lb';
    const rows = cur.ex.rows, last = rows[rows.length - 1];
    if (last && last.reps === reps && last.weight === weight) last.sets++;   // identical consecutive sets collapse
    else rows.push({ id:uid(), sets:1, reps, weight });
  };

  for (const raw of text.split(/\r?\n/)) {
    const line = raw.replace(/[\u200B-\u200F\u2060\uFEFF]/g, '').trim();
    if (!line) continue;
    const d = parseDateLine(line);
    if (d) {
      if (cur && cur.exs.length === 0) cur.date = d; else start(d);
      cur.lines.push(line);
      continue;
    }
    const ms = [...line.matchAll(SET_G)];
    if (!ms.length) addName(line);
    else {
      let pos = 0;
      ms.forEach(m => { const before = line.slice(pos, m.index); if (before.trim()) addName(before); addSet(m); pos = m.index + m[0].length; });
      const tail = line.slice(pos); if (tail.trim()) addName(tail);
    }
    if (cur) cur.lines.push(line);
  }

  // Screenshots of the same workout (same date) are combined
  const byDate = new Map();
  sessions.forEach(s => {
    const exs = dedupeAdjacent(s.exs.filter(e => e.rows.length));
    if (!exs.length) return;
    const m = byDate.get(s.date);
    if (!m) { byDate.set(s.date, { date:s.date, unit:s.unit, lines:[...s.lines], exs }); return; }
    m.lines.push('', ...s.lines); m.unit = m.unit || s.unit;
    exs.forEach(e => {
      const i = e.name ? m.exs.findIndex(x => norm(x.name) === norm(e.name)) : -1;
      if (i === -1) m.exs.push(e); else if (setCount(e) > setCount(m.exs[i])) m.exs[i] = e;
    });
  });
  return [...byDate.values()].map(m => finishSession('Pasted text', m.date, m.unit, m.lines.join('\n'), m.exs, entries));
}

function ImportFlow({ entries, setEntries, unit, toast }) {
  const fileRef = useRef();
  const [busy, setBusy] = useState(null);
  const [sessions, setSessions] = useState(null);
  const [pasteOpen, setPasteOpen] = useState(false);
  const [pasteText, setPasteText] = useState('');

  useEffect(() => {
    document.body.style.overflow = (sessions || busy || pasteOpen) ? 'hidden' : '';
    return () => { document.body.style.overflow = ''; };
  }, [sessions, busy, pasteOpen]);

  const preview = useMemo(() => pasteOpen && pasteText.trim() ? parseText(pasteText, entries) : [], [pasteOpen, pasteText, entries]);
  const pvEx = preview.reduce((n, s) => n + s.exercises.length, 0);
  const pvSets = preview.reduce((n, s) => n + s.exercises.reduce((m, x) => m + x.rows.length, 0), 0);

  const pasteClip = async () => {
    try {
      const t = await navigator.clipboard.readText();
      if (!t || !t.trim()) return toast('The clipboard is empty');
      setPasteText(p => p.trim() ? p.replace(/\s+$/, '') + '\n\n' + t : t);
    } catch (e) { toast('Touch and hold in the box, then tap Paste'); }
  };
  const readPasted = () => {
    const out = parseText(pasteText, entries);
    if (!out.length) return toast('No sets found. Copy the whole list, with lines like "8 reps x 347 lb".');
    setSessions(out); setPasteOpen(false); setPasteText('');
  };

  const onFiles = async ev => {
    const files = [...ev.target.files]; ev.target.value = '';
    if (!files.length) return;
    let worker;
    try {
      setBusy({ i:0, n:files.length, pct:0, label:'Loading text reader…' });
      const T = await loadTesseract();
      worker = await T.createWorker('eng', 1, {
        logger: m => { if (m.status === 'recognizing text') setBusy(b => b && ({ ...b, pct:m.progress, label:'Reading screenshot' })); },
      });
      const out = [];
      for (let i = 0; i < files.length; i++) {
        setBusy({ i, n:files.length, pct:0, label:'Reading screenshot' });
        const canvas = await prepImage(files[i]);
        const { data } = await worker.recognize(canvas);
        out.push(buildSession(files[i].name, data, canvas.width, entries));
      }
      setSessions(out);
    } catch (err) {
      console.error(err);
      toast('Could not read the screenshot. Check your connection and try again.');
    } finally {
      if (worker) { try { await worker.terminate(); } catch (e) {} }
      setBusy(null);
    }
  };

  const upSession = (sid, fn) => setSessions(ss => ss.map(s => s.id === sid ? fn(s) : s));
  const upEx = (sid, eid, p) => upSession(sid, s => ({ ...s, exercises: s.exercises.map(x => x.id === eid ? { ...x, ...p } : x) }));
  const upRow = (sid, eid, rid, p) => upSession(sid, s => ({ ...s, exercises: s.exercises.map(x => x.id === eid ? { ...x, rows: x.rows.map(r => r.id === rid ? { ...r, ...p } : r) } : x) }));
  const addRow = (sid, eid) => upSession(sid, s => ({ ...s, exercises: s.exercises.map(x => x.id === eid ? { ...x, rows: [...x.rows, { ...x.rows[x.rows.length - 1], id:uid() }] } : x) }));
  const delRow = (sid, eid, rid) => upSession(sid, s => ({ ...s, exercises: s.exercises.map(x => x.id === eid && x.rows.length > 1 ? { ...x, rows: x.rows.filter(r => r.id !== rid) } : x) }));
  const delEx = (sid, eid) => upSession(sid, s => ({ ...s, exercises: s.exercises.filter(x => x.id !== eid) }));
  const addEx = sid => upSession(sid, s => ({ ...s, exercises: [...s.exercises, { id:uid(), name:'', muscle:'', perSide:false, include:true, rows:[{ id:uid(), sets:'1', reps:'10', weight:'' }] }] }));

  const isDup = (s, ex) => ex.name.trim() && entries.some(e => e.date === s.date && norm(e.exercise) === norm(ex.name));
  const count = sessions ? sessions.reduce((n, s) => n + s.exercises.filter(x => x.include).reduce((m, x) => m + x.rows.length, 0), 0) : 0;

  const commit = () => {
    const out = [];
    for (const s of sessions) for (const ex of s.exercises) {
      if (!ex.include) continue;
      const name = ex.name.trim();
      if (!name) return toast('Give every selected exercise a name');
      if (!ex.muscle) return toast(`Choose a muscle for ${name}`);
      for (const r of ex.rows) {
        const sets = parseFloat(r.sets), reps = parseFloat(r.reps), weight = parseFloat(r.weight) || 0;
        if (!(sets > 0) || !(reps > 0)) return toast(`Check the sets and reps for ${name}`);
        out.push({ id:uid(), date:s.date, muscle:ex.muscle, exercise:name, sets, reps, weight, mult: ex.perSide ? 2 : 1 });
      }
    }
    if (!out.length) return toast('Nothing selected to import');
    setEntries(es => [...es, ...out]);
    setSessions(null);
    toast(`Imported ${out.length} ${out.length === 1 ? 'entry' : 'entries'}`);
  };

  return (
    <>
      <div className="card">
        <b>Import workouts</b>
        <p className="note" style={{margin:'2px 0 10px'}}>Copy the text from a workout screenshot and paste it here. You review everything before it's saved.</p>
        <div style={{display:'flex',gap:10,flexWrap:'wrap'}}>
          <button className="btn-sm go" onClick={() => setPasteOpen(true)}>Paste text</button>
          <button className="btn-sm" onClick={() => fileRef.current && fileRef.current.click()}>Scan image (less accurate)</button>
        </div>
      </div>
      <input ref={fileRef} type="file" accept="image/*" multiple hidden onChange={onFiles}/>

      {pasteOpen && (
        <div className="overlay" role="dialog" aria-label="Paste workout text">
          <div className="ov-in">
            <h1 style={{marginBottom:10}}>Paste text</h1>
            <ol className="steps">
              <li>Open the screenshot in Photos.</li>
              <li>Touch and hold the text, tap Select All, then Copy.</li>
              <li>Come back and paste it below. Do the same for more screenshots and paste them one after another.</li>
            </ol>
            <button className="btn-sm" onClick={pasteClip}>Paste from clipboard</button>
            <textarea className="in" style={{marginTop:12,minHeight:240}} value={pasteText} onChange={e => setPasteText(e.target.value)}
              placeholder={'Oct 3, 2026, 11:26 AM\nLeg Press\n8 reps x 347 lb\n6 reps x 437 lb'} aria-label="Pasted workout text"/>
            <p className="note" role="status">
              {!pasteText.trim() ? 'Pasted text will be read for exercises, sets, weights and the workout date.'
                : pvSets === 0 ? 'No sets found yet. Lines should look like "8 reps x 347 lb".'
                : `Found ${pvEx} ${pvEx === 1 ? 'exercise' : 'exercises'} and ${pvSets} ${pvSets === 1 ? 'row' : 'rows'} across ${preview.length} ${preview.length === 1 ? 'workout' : 'workouts'}. You'll review them next.`}
            </p>
          </div>
          <div className="ov-foot">
            <div className="inner">
              <button className="ghost" onClick={() => { setPasteOpen(false); }}>Cancel</button>
              <button className="ghost" onClick={() => setPasteText('')} disabled={!pasteText}>Clear</button>
              <button className="primary" disabled={pvSets === 0} onClick={readPasted}>Review</button>
            </div>
          </div>
        </div>
      )}

      {busy && (
        <div className="overlay center" role="status">
          <div className="card busy">
            <h2>{busy.label}</h2>
            <div className="track" style={{marginBottom:10}}><div className="fill" style={{width: Math.min(100, (busy.i + busy.pct) / busy.n * 100) + '%'}}/></div>
            <div className="note" style={{margin:0}}>Screenshot {busy.i + 1} of {busy.n}. Images are read on your device and never uploaded. The first scan downloads the text reader, so it takes longer.</div>
          </div>
        </div>
      )}

      {sessions && (
        <div className="overlay">
          <div className="ov-in">
            <h1 style={{marginBottom:6}}>Review import</h1>
            <p className="note" style={{marginTop:0,marginBottom:16}}>Reading can make mistakes. Check each exercise, muscle and number. Nothing is saved until you tap Add.</p>

            {sessions.map((s, si) => (
              <div className="card" key={s.id}>
                <h2>{sessions.length > 1 ? `Workout ${si + 1} of ${sessions.length}` : 'Workout'}</h2>
                <div className="note" style={{margin:'-6px 0 12px',wordBreak:'break-all'}}>{s.name}</div>
                <label className="f" htmlFor={'d' + s.id}>Workout date</label>
                <input id={'d' + s.id} type="date" className="in" value={s.date} onChange={e => e.target.value && upSession(s.id, x => ({ ...x, date:e.target.value }))}/>
                {s.unit && s.unit !== unit && <p className="warnline">This text uses {s.unit} but the app is set to {unit}. Numbers import as shown, so edit them or change the unit in Settings first.</p>}
                {s.exercises.length === 0 && <p className="note">No sets were found. Add exercises by hand below.</p>}

                {s.exercises.map(ex => {
                  const dup = isDup(s, ex);
                  return (
                    <div key={ex.id} className={'rvex' + (ex.include ? '' : ' off')}>
                      <div className="rvtop">
                        <button type="button" className={'chip' + (ex.include ? ' on' : '')} aria-pressed={ex.include} onClick={() => upEx(s.id, ex.id, { include:!ex.include })}>{ex.include ? '✓ Importing' : 'Skipped'}</button>
                        <button type="button" className={'chip' + (ex.perSide ? ' on' : '')} aria-pressed={!!ex.perSide} onClick={() => upEx(s.id, ex.id, { perSide:!ex.perSide })}>Per side ×2</button>
                        <button type="button" className="x" aria-label="Remove exercise" onClick={() => delEx(s.id, ex.id)}>×</button>
                      </div>
                      <input className="in" value={ex.name} placeholder="Exercise name" autoCapitalize="words" autoCorrect="off" aria-label="Exercise name"
                        onChange={e => { const name = e.target.value; upEx(s.id, ex.id, { name, ...(ex.muscle ? {} : { muscle: guessMuscle(name, entries) }) }); }}/>
                      <select className="in" style={{marginTop:8}} value={ex.muscle} aria-label="Muscle" onChange={e => upEx(s.id, ex.id, { muscle:e.target.value })}>
                        <option value="">Choose muscle…</option>
                        {MUSCLES.map(m => <option key={m.id} value={m.id}>{m.id}</option>)}
                      </select>
                      {dup && <p className="warnline">You already logged this exercise on this date. {ex.include ? 'Skip it to avoid doubling up.' : 'It is skipped so it will not be doubled.'}</p>}
                      <div className="rvgrid head"><span style={{textAlign:'center'}}>Sets</span><span style={{textAlign:'center'}}>Reps</span><span style={{textAlign:'center'}}>Weight ({unit})</span><span/></div>
                      {ex.rows.map((r, ri) => (
                        <div className="rvgrid" key={r.id}>
                          <input className="in" inputMode="decimal" value={r.sets} aria-label={`Row ${ri + 1} sets`} onChange={e => upRow(s.id, ex.id, r.id, { sets:e.target.value })}/>
                          <input className="in" inputMode="decimal" value={r.reps} aria-label={`Row ${ri + 1} reps`} onChange={e => upRow(s.id, ex.id, r.id, { reps:e.target.value })}/>
                          <input className="in" inputMode="decimal" value={r.weight} aria-label={`Row ${ri + 1} weight`} onChange={e => upRow(s.id, ex.id, r.id, { weight:e.target.value })}/>
                          <button type="button" className="rowx" aria-label={`Remove row ${ri + 1}`} disabled={ex.rows.length === 1} onClick={() => delRow(s.id, ex.id, r.id)}>×</button>
                        </div>
                      ))}
                      <button type="button" className="addrow" onClick={() => addRow(s.id, ex.id)}>+ Add row</button>
                    </div>
                  );
                })}

                <button type="button" className="addrow" onClick={() => addEx(s.id)}>+ Add exercise</button>
                {s.text && (
                  <details>
                    <summary>Show source text</summary>
                    <pre className="raw">{s.text}</pre>
                  </details>
                )}
              </div>
            ))}
          </div>

          <div className="ov-foot">
            <div className="inner">
              <button className="ghost" onClick={() => { if (confirm('Discard this import?')) setSessions(null); }}>Cancel</button>
              <button className="primary" disabled={count === 0} onClick={commit}>Add {count} {count === 1 ? 'entry' : 'entries'}</button>
            </div>
          </div>
        </div>
      )}
    </>
  );
}

/* ---------- Log ---------- */
function Log({ entries, setEntries, form, setForm, unit, toast, onEdit }) {
  const set = patch => setForm(f => ({ ...f, ...patch }));
  const index = useMemo(() => buildIndex(entries), [entries]);

  const onExercise = (v, muscleHint, picked) => {
    const patch = { exercise: v };
    const ls = lastSession(entries, v, form.date) || lastSession(entries, v);
    if (ls) {
      patch.muscle = ls.rows[0].muscle;
      patch.perSide = ls.rows[0].mult === 2;
      patch.rows = ls.rows.map(e => ({ id:uid(), sets:String(e.sets), reps:String(e.reps), weight:String(e.weight) }));
    } else if (picked) { patch.perSide = false; if (muscleHint) patch.muscle = muscleHint; }
    set(patch);
  };

  const setRow = (i, p) => set({ rows: form.rows.map((r, j) => j === i ? { ...r, ...p } : r) });
  const addRow = () => { const l = form.rows[form.rows.length - 1]; set({ rows: [...form.rows, { ...l, id:uid() }] }); };
  const removeRow = i => { if (form.rows.length > 1) set({ rows: form.rows.filter((_, j) => j !== i) }); };

  const save = () => {
    const exercise = form.exercise.trim();
    const rows = form.rows.map(r => ({ sets:parseFloat(r.sets), reps:parseFloat(r.reps), weight:parseFloat(r.weight) || 0 }));
    if (!exercise) return toast('Enter an exercise name');
    if (rows.some(r => !(r.sets > 0) || !(r.reps > 0))) return toast('Each row needs sets and reps above 0');

    // Personal record check against everything logged before this save
    const prior = bests(entries, exercise);
    let newW = 0, newE = 0;
    rows.forEach(r => { newW = Math.max(newW, r.weight); newE = Math.max(newE, e1rm(r.weight, r.reps)); });
    let pr = '';
    if (prior.n > 0) {
      if (newW > 0 && newW > prior.w) pr = `★ New weight PR: ${newW} ${unit}`;
      else if (newE > prior.e + 0.5) pr = `★ New est. 1RM PR: ${Math.round(newE)} ${unit}`;
    }

    setEntries(es => [...es, ...rows.map(r => ({ id:uid(), date:form.date, muscle:form.muscle, exercise, ...r, mult: form.perSide ? 2 : 1 }))]);
    if (pr) toast(`${pr} · ${exercise}`, 3800);
    else toast(`Added ${exercise}: ${rows.length} ${rows.length === 1 ? 'row' : 'rows'}`);
  };

  const ref = lastSession(entries, form.exercise, form.date);
  const best = form.exercise.trim() ? bests(entries, form.exercise) : null;
  const dayEntries = entries.filter(e => e.date === form.date).reverse();
  const step = unit === 'kg' ? 2.5 : 5;

  return (
    <div>
      <ImportFlow entries={entries} setEntries={setEntries} unit={unit} toast={toast}/>
      <div className="card">
        <div className="field">
          <label className="f" htmlFor="date">Date</label>
          <input id="date" type="date" className="in" value={form.date} max={addDays(today(), 1)} onChange={e => e.target.value && set({ date:e.target.value })}/>
        </div>
        <div className="field">
          <label className="f">Muscle</label>
          <div className="chips" role="group" aria-label="Muscle">
            {MUSCLES.map(m => (
              <button key={m.id} type="button" className={'chip' + (form.muscle === m.id ? ' on' : '')} onClick={() => set({ muscle:m.id })} aria-pressed={form.muscle === m.id}>
                <span className="dot" style={{background:m.color}}/>{m.id}
              </button>
            ))}
          </div>
        </div>
        <div className="field">
          <label className="f" htmlFor="ex">Exercise</label>
          <ExercisePicker id="ex" value={form.exercise} onChange={v => onExercise(v)} onPick={o => onExercise(o.name, o.muscle, true)}
            index={index} muscle={form.muscle} placeholder="Search or type an exercise"/>
          {ref && (
            <div className="lasttime">
              <div className="lt-head">
                <span>Last time · {short(ref.date)} ({ago(ref.date)})</span>
                <button type="button" className="linkbtn" onClick={() => set({ rows: ref.rows.map(e => ({ id:uid(), sets:String(e.sets), reps:String(e.reps), weight:String(e.weight) })) })}>Use these</button>
              </div>
              <div className="lt-rows">{ref.rows.map(r => <span className="lt-chip" key={r.id}>{rowText(r)}</span>)}</div>
              {best && best.w > 0 && <div style={{marginTop:6,color:'var(--muted)'}}>Best: {best.w} {unit} · est. 1RM {Math.round(best.e)}</div>}
            </div>
          )}
        </div>
        <div className="field">
          <div style={{marginBottom:12}}>
            <button type="button" className={'chip' + (form.perSide ? ' on' : '')} aria-pressed={!!form.perSide} onClick={() => set({ perSide: !form.perSide })}>Per side ×2</button>
            {form.perSide && <p className="note" style={{marginTop:6,marginBottom:0}}>Enter the weight for one side. Tonnage counts it twice.</p>}
          </div>
          {form.rows.map((r, i) => (
            <div className="rowgrid" key={r.id}>
              <Stepper label="Sets" showLabel={i === 0} value={r.sets} onChange={v => setRow(i, { sets:v })} step={1}/>
              <Stepper label="Reps" showLabel={i === 0} value={r.reps} onChange={v => setRow(i, { reps:v })} step={1}/>
              <Stepper label={`Weight (${unit})`} showLabel={i === 0} value={r.weight} onChange={v => setRow(i, { weight:v })} step={step}/>
              <button type="button" className="rowx" aria-label={`Remove row ${i + 1}`} disabled={form.rows.length === 1} onClick={() => removeRow(i)}>×</button>
            </div>
          ))}
          <button type="button" className="addrow" onClick={addRow}>+ Add another weight</button>
        </div>
        <button className="primary" onClick={save}>Add to log</button>
        <p className="note">Each row is saved as its own entry for this exercise. Muscle, exercise and rows stay filled in after you add. Picking an exercise you've logged before fills in the rows from your last session.</p>
      </div>

      <h2>{form.date === today() ? 'Today' : longDay(form.date)}</h2>
      <div className="card" style={{paddingTop:4,paddingBottom:4}}>
        {dayEntries.length === 0
          ? <div className="empty" style={{padding:'16px 0'}}>Nothing logged for this day yet.</div>
          : dayEntries.map(e => <EntryRow key={e.id} e={e} unit={unit} onEdit={() => onEdit(e.id)} onDelete={() => setEntries(es => es.filter(x => x.id !== e.id))}/>)}
      </div>
    </div>
  );
}

/* ---------- History ---------- */
function HistoryView({ entries, setEntries, unit, onEdit }) {
  const [limit, setLimit] = useState(60);
  const sorted = [...entries].sort((a, b) => a.date === b.date ? 0 : a.date < b.date ? 1 : -1);
  const groups = [];
  sorted.slice(0, limit).forEach(e => {
    const g = groups[groups.length - 1];
    if (g && g.date === e.date) g.items.push(e); else groups.push({ date:e.date, items:[e] });
  });
  if (entries.length === 0) return <div className="card empty">Your logged sets will appear here.</div>;
  return (
    <div>
      <p className="note" style={{marginTop:0}}>Tap an entry to edit it.</p>
      {groups.map(g => (
        <div key={g.date}>
          <div className="dayhead">{longDay(g.date)}</div>
          <div className="card" style={{paddingTop:4,paddingBottom:4,marginBottom:0}}>
            {g.items.map(e => <EntryRow key={e.id} e={e} unit={unit} onEdit={() => onEdit(e.id)}
              onDelete={() => { if (confirm(`Delete ${e.exercise} on ${short(e.date)}?`)) setEntries(es => es.filter(x => x.id !== e.id)); }}/>)}
          </div>
        </div>
      ))}
      {sorted.length > limit && <button className="ghost" style={{width:'100%',marginTop:14}} onClick={() => setLimit(limit + 60)}>Show older entries</button>}
    </div>
  );
}

/* ---------- Lifts (per-exercise progress) ---------- */
function Lifts({ entries, setEntries, unit }) {
  const index = useMemo(() => buildIndex(entries), [entries]);
  const [name, setName] = useState(() => {
    const last = [...entries].sort((a, b) => a.date < b.date ? 1 : -1)[0];
    return last ? last.exercise : '';
  });
  const [metric, setMetric] = useState('weight');
  const k = norm(name);

  const sessions = useMemo(() => {
    const by = {};
    entries.forEach(e => { if (norm(e.exercise) === k) (by[e.date] = by[e.date] || []).push(e); });
    return Object.keys(by).sort().map(date => {
      const rows = by[date];
      return {
        date, rows,
        weight: Math.max(...rows.map(r => r.weight)),
        e1rm: Math.max(...rows.map(r => e1rm(r.weight, r.reps))),
        volume: rows.reduce((s, r) => s + r.sets * r.reps * r.weight * (r.mult || 1), 0),
      };
    });
  }, [entries, k]);

  const mv = s => metric === 'weight' ? s.weight : metric === 'e1rm' ? Math.round(s.e1rm) : s.volume;
  let run = 0;
  const all = sessions.map((s, i) => { const v = mv(s); const pr = i > 0 && v > run; run = Math.max(run, v); return { ...s, value:v, pr, label:tick(s.date) }; });
  const pts = all.slice(-20);
  const bestW = all.reduce((b, s) => s.weight > b.v ? { v:s.weight, d:s.date } : b, { v:0, d:'' });
  const bestE = all.reduce((b, s) => Math.round(s.e1rm) > b.v ? { v:Math.round(s.e1rm), d:s.date } : b, { v:0, d:'' });
  const metricName = metric === 'weight' ? 'Top weight' : metric === 'e1rm' ? 'Est. 1RM' : 'Volume';
  const sideAll = sessions.length > 0 && sessions.every(s => s.rows.every(r => r.mult === 2));
  const toggleSide = () => setEntries(es => es.map(e => norm(e.exercise) === k ? { ...e, mult: sideAll ? 1 : 2 } : e));

  if (entries.length === 0) return <div className="card empty">Log some sets to see progress for each exercise.</div>;

  return (
    <div>
      <div className="field">
        <label className="f" htmlFor="lift-ex">Exercise</label>
        <ExercisePicker id="lift-ex" value={name} onChange={setName} onPick={o => setName(o.name)} index={index.filter(o => o.count > 0)} placeholder="Search your exercises"/>
      </div>

      {sessions.length === 0 ? (
        <div className="card empty">No sessions found for that exercise. Pick one from the list.</div>
      ) : (
        <>
          <div className="card" style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:12}}>
            <div>
              <b>Weight is per side</b>
              <div className="note" style={{margin:'2px 0 0'}}>Counts tonnage ×2 for all {sessions.reduce((n, s) => n + s.rows.length, 0)} logged rows of this exercise. Weights and records still show what you entered.</div>
            </div>
            <button type="button" className={'chip' + (sideAll ? ' on' : '')} aria-pressed={sideAll} onClick={toggleSide}>{sideAll ? 'On' : 'Off'}</button>
          </div>
          <div className="stats">
            <div className="stat"><span className="num">{bestW.v ? bestW.v : '–'}</span><small>Best weight ({unit})</small><small>{bestW.d ? short(bestW.d) : 'none logged'}</small></div>
            <div className="stat"><span className="num">{bestE.v ? bestE.v : '–'}</span><small>Est. 1RM ({unit})</small><small>{bestE.d ? short(bestE.d) : 'none logged'}</small></div>
            <div className="stat"><span className="num">{sessions.length}</span><small>{sessions.length === 1 ? 'Session' : 'Sessions'}</small><small>last {ago(sessions[sessions.length - 1].date)}</small></div>
          </div>

          <div className="card">
            <div className="seg" style={{marginBottom:12}} role="group" aria-label="Measure">
              {[['weight', 'Top weight'], ['e1rm', 'Est. 1RM'], ['volume', 'Volume']].map(([id, l]) => <button key={id} className={metric === id ? 'on' : ''} onClick={() => setMetric(id)}>{l}</button>)}
            </div>
            <div className="sub" style={{minHeight:0}}>{metricName} per session{metric !== 'weight' && metric !== 'e1rm' ? ` (${unit})` : ` (${unit})`} · last {pts.length} {pts.length === 1 ? 'session' : 'sessions'}</div>
            {pts.every(p => p.value === 0)
              ? <div className="empty" style={{padding:'16px 0'}}>No weight was logged for this exercise, so there is nothing to chart.</div>
              : <LineChart pts={pts} color="var(--steel)"/>}
            <div className="legend">Gold dots are personal records for this measure. Est. 1RM uses the Epley formula (weight × (1 + reps ÷ 30)).</div>
          </div>

          <h2>Recent sessions</h2>
          <div className="card" style={{paddingTop:4,paddingBottom:4}}>
            {[...all].reverse().slice(0, 10).map(s => (
              <div className="entry" key={s.date}>
                <div className="grow">
                  <div className="ex">{short(s.date)}{s.pr && <span className="prbadge">PR</span>}</div>
                  <div className="meta">{s.rows.map(rowText).join(' · ')}</div>
                </div>
              </div>
            ))}
          </div>
        </>
      )}
    </div>
  );
}

/* ---------- Settings ---------- */
function Settings({ entries, setEntries, prefs, setPrefs, toast, loadSample, backup }) {
  const [text, setText] = useState('');
  const fileRef = useRef();
  const unit = prefs.unit;
  const targets = prefs.targets || {};
  const exportJson = useMemo(() => JSON.stringify({ app:'volume-tracker', version:2, exportedAt:new Date().toISOString(), entries, prefs }), [entries, prefs]);

  const copy = async () => {
    try { await navigator.clipboard.writeText(exportJson); toast('Backup copied'); }
    catch (e) { const ta = document.getElementById('export-box'); if (ta) { ta.focus(); ta.select(); } toast('Select all and copy the text'); }
  };

  const importText = txt => {
    try {
      const data = JSON.parse(txt);
      const arr = Array.isArray(data) ? data : data.entries;
      if (!Array.isArray(arr)) throw new Error();
      const clean = arr.filter(e => e && e.date && e.muscle && e.exercise && e.sets > 0 && e.reps > 0)
        .map(e => ({ id:e.id || uid(), date:e.date, muscle:e.muscle, exercise:String(e.exercise), sets:+e.sets, reps:+e.reps, weight:+e.weight || 0, mult: +e.mult === 2 ? 2 : 1 }));
      const have = new Set(entries.map(x => x.id));
      const fresh = clean.filter(e => !have.has(e.id));
      setEntries(es => [...es, ...fresh]);
      const bt = !Array.isArray(data) && data.prefs && data.prefs.targets;
      if (bt && !Object.values(targets).some(v => v > 0)) setPrefs({ ...prefs, targets:bt });
      toast(`Imported ${fresh.length} new ${fresh.length === 1 ? 'entry' : 'entries'}`);
      return true;
    } catch (e) { toast('That is not a valid backup'); return false; }
  };

  const onFile = async ev => {
    const f = ev.target.files[0]; ev.target.value = '';
    if (!f) return;
    try { importText(await f.text()); } catch (e) { toast('Could not read that file'); }
  };

  const exportCsv = async () => {
    if (!entries.length) return toast('Nothing to export yet');
    const r = await saveFile(`volume-log-${today()}.csv`, toCsv(entries, unit), 'text/csv');
    if (r === 'downloaded') toast('CSV downloaded');
  };

  const setT = (id, n) => setPrefs({ ...prefs, targets:{ ...targets, [id]: Math.max(0, Math.min(60, n)) } });
  const setAllT = n => setPrefs({ ...prefs, targets: Object.fromEntries(MUSCLES.map(m => [m.id, n])) });

  return (
    <div>
      <div className="card">
        <h2>Weight unit</h2>
        <div className="seg">
          {['lb', 'kg'].map(u => <button key={u} className={prefs.unit === u ? 'on' : ''} onClick={() => setPrefs({ ...prefs, unit:u })}>{u}</button>)}
        </div>
        <p className="note">Changes the label only. Existing numbers are not converted.</p>
      </div>

      <div className="card">
        <h2>Weekly set targets</h2>
        <p className="note" style={{marginTop:0}}>Sets per week for each muscle. Set 0 for no target. Trends shows under, on target (up to 25% above) or over. Monthly views scale the target to the month's length.</p>
        <div style={{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap',margin:'10px 0'}}>
          <span style={{color:'var(--muted)',fontWeight:600,fontSize:14}}>Set all to</span>
          {[10, 12, 16].map(n => <button key={n} className="ghost" style={{minHeight:40,padding:'6px 14px'}} onClick={() => setAllT(n)}>{n}</button>)}
          <button className="ghost" style={{minHeight:40,padding:'6px 14px'}} onClick={() => setAllT(0)}>Off</button>
        </div>
        {MUSCLES.map(m => {
          const v = targets[m.id] || 0;
          return (
            <div className="trow" key={m.id}>
              <span className="dot" style={{background:m.color}}/>
              <span className="tn">{m.id}</span>
              <div className="step small">
                <button type="button" aria-label={`Lower ${m.id} target`} onClick={() => setT(m.id, v - 1)}>−</button>
                <div className="tval">{v > 0 ? v : 'Off'}</div>
                <button type="button" aria-label={`Raise ${m.id} target`} onClick={() => setT(m.id, v + 1)}>+</button>
              </div>
            </div>
          );
        })}
      </div>

      <div className="card">
        <h2>Back up and restore</h2>
        {!store.persistent && <p className="note down" style={{marginTop:0}}>This browser is blocking storage, so your data will be lost when you close the page.</p>}
        <p className="note" style={{marginTop:0,marginBottom:12}}>Last backup: {backup.lastText}{backup.newSince > 0 ? ` · ${backup.newSince} new ${backup.newSince === 1 ? 'entry' : 'entries'} since` : ''}. Data is saved only in this browser, so Safari and Firefox keep separate copies.</p>
        <div style={{display:'flex',gap:10,flexWrap:'wrap'}}>
          <button className="btn-sm go" onClick={backup.run}>Save backup file</button>
          <button className="btn-sm" onClick={() => fileRef.current && fileRef.current.click()}>Choose backup file</button>
        </div>
        <input ref={fileRef} type="file" accept=".json,application/json,text/plain" hidden onChange={onFile}/>
        <p className="note">Save backup file opens the share sheet, where you can pick Save to Files. Restoring adds entries that aren't already here and never overwrites existing ones.</p>
        <details>
          <summary>Backup as text instead</summary>
          <textarea id="export-box" className="in" readOnly value={exportJson} style={{marginTop:8}}/>
          <div style={{marginTop:10}}><button className="ghost" onClick={copy}>Copy backup text</button></div>
          <label className="f" style={{marginTop:16}} htmlFor="imp">Restore from pasted text</label>
          <textarea id="imp" className="in" value={text} onChange={e => setText(e.target.value)} placeholder="Paste backup text here"/>
          <div style={{marginTop:10}}><button className="ghost" onClick={() => { if (importText(text)) setText(''); }} disabled={!text.trim()}>Import entries</button></div>
        </details>
      </div>

      <div className="card">
        <h2>Export to spreadsheet</h2>
        <p className="note" style={{marginTop:0}}>One row per logged entry: date, muscle, exercise, sets, reps, weight, unit and volume. It's for spreadsheets only and can't be restored into the app, so use a backup file for that.</p>
        <button className="btn-sm" style={{marginTop:6}} onClick={exportCsv}>Export CSV</button>
      </div>

      <div className="card">
        <h2>Data</h2>
        <div style={{display:'flex',gap:10,flexWrap:'wrap'}}>
          <button className="ghost" onClick={() => { loadSample(); toast('Sample data added'); }}>Add sample data</button>
          <button className="ghost danger" onClick={() => { if (confirm('Delete all logged sets? This cannot be undone.')) { setEntries([]); toast('All entries deleted'); } }}>Delete everything</button>
        </div>
      </div>
    </div>
  );
}

/* ---------- App ---------- */
const DEFAULT_PREFS = { metric:'sets', unit:'lb', ma:{ week:4, month:3 }, targets:{} };

function App() {
  const [entries, setEntries] = useState(() => load('vol.entries', []));
  const [prefs, setPrefs] = useState(() => {
    const p = load('vol.prefs', {});
    return { ...DEFAULT_PREFS, ...p, ma:{ ...DEFAULT_PREFS.ma, ...(p.ma || {}) }, targets:{ ...(p.targets || {}) } };
  });
  const [bk, setBk] = useState(() => {
    const b = load('vol.backup', null) || {};
    return { first: b.first || today(), last: b.last || null, count: b.count || 0, snooze: b.snooze || null };
  });
  const [tab, setTab] = useState('dash');
  const [msg, setMsg] = useState(null);
  const [editId, setEditId] = useState(null);
  const timer = useRef();
  const [form, setForm] = useState({ date:today(), muscle:'Chest', exercise:'', perSide:false, rows:[{ id:uid(), sets:'3', reps:'10', weight:'' }] });

  useEffect(() => store.set('vol.entries', JSON.stringify(entries)), [entries]);
  useEffect(() => store.set('vol.prefs', JSON.stringify(prefs)), [prefs]);
  useEffect(() => store.set('vol.backup', JSON.stringify(bk)), [bk]);
  useEffect(() => { try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) {} }, []);

  const toast = (m, ms = 2200) => { setMsg(m); clearTimeout(timer.current); timer.current = setTimeout(() => setMsg(null), ms); };
  const loadSample = () => setEntries(es => [...es, ...sampleData()]);
  const go = t => { setTab(t); window.scrollTo(0, 0); };

  const newSince = Math.max(0, entries.length - (bk.count || 0));
  const sinceDays = daysBetween(bk.last || bk.first, today());
  const needed = entries.length > 0 && (!bk.snooze || today() >= bk.snooze) && (sinceDays >= 14 || newSince >= 40);
  const doBackup = async () => {
    const payload = JSON.stringify({ app:'volume-tracker', version:2, exportedAt:new Date().toISOString(), entries, prefs });
    const r = await saveFile(`volume-backup-${today()}.json`, payload, 'application/json');
    if (r === 'cancelled') return;
    setBk(b => ({ ...b, last:today(), count:entries.length, snooze:null }));
    toast(r === 'shared' ? 'Backup saved' : 'Backup downloaded');
  };
  const backup = {
    needed, run: doBackup, newSince,
    lastText: bk.last ? ago(bk.last) : 'never',
    text: (bk.last ? `Last backup ${ago(bk.last)}` : `You haven't backed up yet`) + ` · ${newSince} new ${newSince === 1 ? 'entry' : 'entries'} since. Saving a file takes a few seconds and protects you if the browser clears its data.`,
    later: () => setBk(b => ({ ...b, snooze: addDays(today(), 3) })),
  };

  const editing = editId ? entries.find(e => e.id === editId) : null;
  const titles = { dash:'Volume', log:'Log sets', lifts:'Lifts', hist:'History', set:'Settings' };

  return (
    <div className="app">
      <div className="top">
        <h1>{titles[tab]}</h1>
        {tab === 'dash' && (
          <div className="seg" role="group" aria-label="Volume measure">
            <button className={prefs.metric === 'sets' ? 'on' : ''} onClick={() => setPrefs({ ...prefs, metric:'sets' })}>Sets</button>
            <button className={prefs.metric === 'tonnage' ? 'on' : ''} onClick={() => setPrefs({ ...prefs, metric:'tonnage' })}>Tonnage</button>
          </div>
        )}
      </div>

      {tab === 'dash' && <Dashboard entries={entries} prefs={prefs} setPrefs={setPrefs} goLog={() => go('log')} goSettings={() => go('set')} loadSample={loadSample} backup={backup}/>}
      {tab === 'log' && <Log entries={entries} setEntries={setEntries} form={form} setForm={setForm} unit={prefs.unit} toast={toast} onEdit={setEditId}/>}
      {tab === 'lifts' && <Lifts entries={entries} setEntries={setEntries} unit={prefs.unit}/>}
      {tab === 'hist' && <HistoryView entries={entries} setEntries={setEntries} unit={prefs.unit} onEdit={setEditId}/>}
      {tab === 'set' && <Settings entries={entries} setEntries={setEntries} prefs={prefs} setPrefs={setPrefs} toast={toast} loadSample={loadSample} backup={backup}/>}

      {editing && <EditSheet key={editing.id} entry={editing} entries={entries} unit={prefs.unit} toast={toast}
        onClose={() => setEditId(null)}
        onSave={u => { setEntries(es => es.map(e => e.id === u.id ? u : e)); setEditId(null); toast('Entry updated'); }}
        onDelete={id => { setEntries(es => es.filter(e => e.id !== id)); setEditId(null); toast('Entry deleted'); }}/>}

      {msg && <div className="toast" role="status">{msg}</div>}

      <nav className="tabbar" aria-label="Main">
        <div className="in-tabs">
          {[['dash', 'Trends'], ['log', 'Log'], ['lifts', 'Lifts'], ['hist', 'History'], ['set', 'Settings']].map(([id, l]) =>
            <button key={id} className={tab === id ? 'on' : ''} onClick={() => go(id)} aria-current={tab === id ? 'page' : undefined}>{l}</button>)}
        </div>
      </nav>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
