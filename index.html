<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Volume</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Volume">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#E4E8EA">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#E4E8EA; --card:#F5F7F7; --ink:#142029; --muted:#5B6B76; --line:#C5CDD2;
    --steel:#2E5A88; --steel-soft:#B9CADB; --collar:#F0B429; --up:#1F7A5A; --down:#B5483A;
    --field:#FFFFFF;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#10171D; --card:#18222A; --ink:#E8EEF1; --muted:#8FA0AB; --line:#2B3842;
      --steel:#6FA3D6; --steel-soft:#2C4258; --collar:#F0B429; --up:#52C79A; --down:#E58B7D;
      --field:#0F161B;
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:'Barlow',-apple-system,system-ui,sans-serif;font-size:16px;line-height:1.35;
    -webkit-text-size-adjust:100%}
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer}
  #root{min-height:100vh}
  .app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 92px)}
  .num{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:700;letter-spacing:.01em;font-variant-numeric:tabular-nums}
  h1{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:34px;margin:0;letter-spacing:.01em}
  h2{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:22px;margin:0 0 10px}
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
  .seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:2px}
  .seg button{border:0;background:transparent;padding:7px 14px;border-radius:8px;font-weight:600;color:var(--muted);min-height:34px}
  .seg button.on{background:var(--ink);color:var(--bg)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
  .weeknav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .weeknav .nav{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:22px;line-height:1}
  .weeknav .nav:disabled{opacity:.3}
  .weeknav .label{text-align:center;background:none;border:0;padding:4px 8px}
  .weeknav .label b{display:block;font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:600}
  .weeknav .label span{font-size:13px;color:var(--muted)}
  .headline{display:flex;align-items:baseline;gap:10px;margin-bottom:2px}
  .headline .big{font-size:52px;line-height:1}
  .headline .unit{color:var(--muted);font-size:15px}
  .sub{color:var(--muted);font-size:14px;margin-bottom:8px;min-height:20px}
  .up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--muted)}
  .rows{display:flex;flex-direction:column}
  .row{display:grid;grid-template-columns:1fr 56px 62px;gap:10px;align-items:center;width:100%;text-align:left;
    background:none;border:0;border-top:1px solid var(--line);padding:11px 4px;min-height:58px}
  .row:first-child{border-top:0}
  .row.sel{background:color-mix(in srgb,var(--collar) 18%,transparent);border-radius:10px}
  .row .name{font-weight:600;display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
  .track{position:relative;height:8px;background:var(--steel-soft);border-radius:4px}
  .fill{position:absolute;left:0;top:0;bottom:0;background:var(--steel);border-radius:4px}
  .tick{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.45}
  .val{text-align:right}
  .val .num{font-size:24px;line-height:1;display:block}
  .val small{font-size:13px;font-weight:600}
  .legend{font-size:13px;color:var(--muted);margin-top:8px}
  label.f{display:block;font-weight:600;font-size:14px;margin:0 0 6px}
  .in{width:100%;background:var(--field);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:16px;min-height:48px;appearance:none;-webkit-appearance:none}
  .in:focus,button:focus-visible{outline:3px solid var(--collar);outline-offset:1px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--field);border-radius:999px;padding:8px 13px;font-weight:500;min-height:40px}
  .chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .step{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:10px;background:var(--field);overflow:hidden}
  .step button{width:34px;border:0;background:transparent;font-size:20px;color:var(--muted);flex:none}
  .step input{flex:1;min-width:0;width:100%;border:0;background:transparent;text-align:center;font-size:18px;font-weight:600;padding:12px 0;font-family:'Barlow Condensed',sans-serif}
  .step input:focus{outline:none}
  .step:focus-within{outline:3px solid var(--collar)}
  .rowgrid{display:grid;grid-template-columns:1fr 1fr 1fr 40px;gap:8px;align-items:end;margin-bottom:8px}
  .rowx{width:40px;height:48px;border:0;background:transparent;font-size:22px;color:var(--muted);border-radius:10px;padding:0}
  .rowx:disabled{opacity:.25}
  .addrow{width:100%;min-height:46px;margin-top:4px;border:1px dashed var(--muted);background:transparent;border-radius:10px;font-weight:600;color:var(--ink)}
  .overlay{position:fixed;top:0;left:0;right:0;bottom:0;z-index:15;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
  .overlay.center{display:flex;align-items:center;justify-content:center;background:rgba(10,15,20,.6);padding:20px;overflow:hidden}
  .ov-in{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 110px)}
  .ov-foot{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 16px calc(env(safe-area-inset-bottom) + 10px)}
  .ov-foot .inner{max-width:560px;margin:0 auto;display:flex;gap:10px}
  .ov-foot .primary{min-height:52px;flex:1}
  .ov-foot .primary:disabled{opacity:.45}
  .busy{width:100%;max-width:340px;margin:0}
  .rvex{border:1px solid var(--line);border-radius:12px;padding:12px;margin:14px 0}
  .rvex.off{opacity:.55}
  .rvtop{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .rvgrid{display:grid;grid-template-columns:1fr 1fr 1.4fr 40px;gap:6px;align-items:center;margin-bottom:6px}
  .rvgrid.head{font-size:13px;font-weight:600;color:var(--muted);margin-top:12px}
  .rvgrid .in{padding:8px;text-align:center;font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:18px;min-height:46px}
  .warnline{font-size:14px;color:var(--down);margin:8px 0 0}
  select.in{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' fill='none' stroke='%238FA0AB' stroke-width='2'/></svg>");background-repeat:no-repeat;background-position:right 14px center;padding-right:38px}
  details{margin-top:14px;font-size:14px;color:var(--muted)}
  summary{cursor:pointer;min-height:36px;display:flex;align-items:center}
  pre.raw{white-space:pre-wrap;word-break:break-word;font-size:12px;background:var(--field);border:1px solid var(--line);border-radius:10px;padding:10px;max-height:220px;overflow:auto;color:var(--ink)}
  .ctrl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
  .seg .seglabel{padding:0 6px 0 10px;align-self:center;color:var(--muted);font-weight:600;font-size:14px}
  .seg button{padding-left:12px;padding-right:12px}
  .banner{border-left:4px solid var(--collar)}
  .banner .brow{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}
  .btn-sm{min-height:46px;border-radius:10px;padding:0 16px;font-weight:600;border:1px solid var(--line);background:var(--field)}
  .btn-sm.go{background:var(--collar);color:#142029;border-color:var(--collar)}
  .status{margin-left:auto;font-size:13px;font-weight:600}
  .status.under{color:var(--muted)} .status.on{color:var(--up)} .status.over{color:#9A6B00}
  @media (prefers-color-scheme: dark){.status.over{color:var(--collar)}}
  .picker{position:relative}
  .pick-list{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:6;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.22);overflow-y:auto;-webkit-overflow-scrolling:touch}
  .pick-list.up{top:auto;bottom:calc(100% + 4px)}
  .pick-opt{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:10px 14px;min-height:52px}
  .pick-opt:first-child{border-top:0}
  .pick-opt:active{background:var(--steel-soft)}
  .pick-opt .pn{display:block;font-weight:600}
  .pick-opt .pm{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pick-opt.new .pn{color:var(--steel)}
  .pick-opt.more .pn{color:var(--muted)}
  .lasttime{margin-top:10px;padding:10px 12px;border:1px dashed var(--line);border-radius:10px;font-size:14px}
  .lt-head{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--muted)}
  .lt-rows{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
  .lt-chip{background:var(--field);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-weight:600}
  .linkbtn{background:none;border:0;color:var(--steel);font-weight:600;padding:8px 4px;min-height:36px}
  .ent-btn{background:none;border:0;padding:0;text-align:left;min-width:0}
  .ent-btn .ex,.ent-btn .meta{display:block}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}
  .stat .num{font-size:28px;line-height:1.05;display:block}
  .stat small{color:var(--muted);font-size:12px;display:block;line-height:1.3}
  .prbadge{background:var(--collar);color:#142029;border-radius:6px;padding:1px 6px;font-size:12px;font-weight:700;margin-left:8px;vertical-align:middle}
  .trow{display:flex;align-items:center;gap:10px;padding:6px 0}
  .trow .tn{flex:1;font-weight:600}
  .step.small{width:150px;flex:none}
  .step.small button{width:44px;min-height:44px}
  .step .tval{flex:1;display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:18px}
  .tabbar .in-tabs button{font-size:18px;padding-left:2px;padding-right:2px}
  .steps{margin:0 0 14px;padding-left:20px;color:var(--muted);font-size:15px}
  .steps li{margin-bottom:4px}
  .rvtop{gap:8px}
  .rvtop .chip{padding:6px 12px;min-height:38px}
  .field{margin-bottom:16px}
  .primary{width:100%;min-height:54px;border:0;border-radius:12px;background:var(--collar);color:#142029;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:22px;letter-spacing:.02em}
  .primary:active{transform:scale(.99)}
  .ghost{border:1px solid var(--line);background:var(--field);border-radius:10px;padding:10px 14px;font-weight:600;min-height:44px}
  .danger{color:var(--down)}
  .entry{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
  .entry:first-of-type{border-top:0}
  .entry .grow{flex:1;min-width:0}
  .entry .ex{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .entry .meta{font-size:14px;color:var(--muted)}
  .x{width:44px;height:44px;border:0;background:transparent;font-size:22px;color:var(--muted);border-radius:10px}
  .dayhead{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:19px;margin:18px 0 4px}
  .empty{text-align:center;padding:26px 10px;color:var(--muted)}
  .empty .ghost{margin-top:12px}
  .tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom);display:flex;justify-content:center;z-index:10}
  .tabbar .in-tabs{display:flex;width:100%;max-width:560px}
  .tabbar button{flex:1;border:0;background:none;padding:14px 4px 12px;font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:19px;color:var(--muted);position:relative}
  .tabbar button.on{color:var(--ink)}
  .tabbar button.on::before{content:"";position:absolute;top:-1px;left:22%;right:22%;height:4px;background:var(--collar);border-radius:0 0 4px 4px}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 82px);background:var(--ink);color:var(--bg);
    padding:11px 18px;border-radius:12px;font-weight:600;z-index:20;max-width:90%;box-shadow:0 6px 20px rgba(0,0,0,.25)}
  textarea.in{min-height:110px;font-family:ui-monospace,Menlo,monospace;font-size:13px}
  .note{font-size:14px;color:var(--muted);margin:8px 0 0}
  svg text{font-family:'Barlow Condensed',sans-serif}
  @media (prefers-reduced-motion:no-preference){ .fill{transition:width .25s ease} }
</style>
</head>
<body>
<div id="root"></div>

<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>

<script type="text/babel">
const { useState, useMemo, useEffect, useRef } = React;

/* ---------- constants ---------- */
const MUSCLES = [
  { id:'Chest',     color:'#2E5A88', ex:['Bench Press','Incline Dumbbell Press','Cable Fly','Push-up'] },
  { id:'Back',      color:'#3D8B8B', ex:['Barbell Row','Lat Pulldown','Pull-up','Seated Cable Row'] },
  { id:'Shoulders', color:'#8A6BB1', ex:['Overhead Press','Lateral Raise','Rear Delt Fly'] },
  { id:'Biceps',    color:'#D1813D', ex:['Barbell Curl','Incline Dumbbell Curl','Hammer Curl'] },
  { id:'Triceps',   color:'#B5483A', ex:['Triceps Pushdown','Skull Crusher','Dip'] },
  { id:'Quads',     color:'#4E8B3A', ex:['Back Squat','Leg Press','Leg Extension'] },
  { id:'Hamstrings',color:'#A0873A', ex:['Romanian Deadlift','Leg Curl'] },
  { id:'Glutes',    color:'#C0638F', ex:['Hip Thrust','Bulgarian Split Squat'] },
  { id:'Calves',    color:'#6B7B88', ex:['Standing Calf Raise','Seated Calf Raise'] },
  { id:'Core',      color:'#5E6AD2', ex:['Cable Crunch','Hanging Leg Raise','Plank'] },
];
const MCOLOR = Object.fromEntries(MUSCLES.map(m => [m.id, m.color]));
const WEEKS_SHOWN = 8;

/* ---------- storage (falls back to memory if blocked) ---------- */
const store = (() => {
  let ok = false; const mem = {};
  try { localStorage.setItem('__t','1'); localStorage.removeItem('__t'); ok = true; } catch(e) {}
  return {
    persistent: ok,
    get(k){ try { return ok ? localStorage.getItem(k) : (mem[k] ?? null); } catch(e){ return mem[k] ?? null; } },
    set(k,v){ if (ok) { try { localStorage.setItem(k,v); return; } catch(e){} } mem[k] = v; },
  };
})();
const load = (k, d) => { try { const v = store.get(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } };

/* ---------- dates (all local time, weeks start Monday) ---------- */
const pad = n => String(n).padStart(2,'0');
const toStr = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fromStr = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (s, n) => { const d = fromStr(s); d.setDate(d.getDate()+n); return toStr(d); };
const weekStart = s => { const d = fromStr(s); const dow = (d.getDay()+6)%7; d.setDate(d.getDate()-dow); return toStr(d); };
const today = () => toStr(new Date());
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const short = s => { const d = fromStr(s); return `${MON[d.getMonth()]} ${d.getDate()}`; };
const longDay = s => { const d = fromStr(s); return d.toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'}); };
const tick = s => { const d = fromStr(s); return `${d.getMonth()+1}/${d.getDate()}`; };

/* ---------- number helpers ---------- */
const fmt = n => {
  if (n >= 10000) return (n/1000).toFixed(0)+'k';
  if (n >= 1000) return (n/1000).toFixed(1).replace(/\.0$/,'')+'k';
  return String(Math.round(n));
};
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const valueOf = (e, metric) => metric === 'sets' ? e.sets : e.sets * e.reps * e.weight * (e.mult || 1);

/* ---------- sample data ---------- */
function sampleData() {
  const out = []; const thisWk = weekStart(today());
  const plan = [
    { d:0, m:'Chest', ex:'Bench Press', sets:4, reps:8, w:155 },
    { d:0, m:'Triceps', ex:'Triceps Pushdown', sets:3, reps:12, w:50 },
    { d:1, m:'Back', ex:'Barbell Row', sets:4, reps:8, w:135 },
    { d:1, m:'Biceps', ex:'Barbell Curl', sets:3, reps:10, w:65 },
    { d:2, m:'Quads', ex:'Back Squat', sets:4, reps:6, w:205 },
    { d:2, m:'Calves', ex:'Standing Calf Raise', sets:3, reps:12, w:120 },
    { d:3, m:'Shoulders', ex:'Overhead Press', sets:3, reps:8, w:95 },
    { d:4, m:'Hamstrings', ex:'Romanian Deadlift', sets:3, reps:8, w:175 },
    { d:4, m:'Core', ex:'Cable Crunch', sets:3, reps:12, w:70 },
  ];
  for (let wk = 7; wk >= 0; wk--) {
    const base = addDays(thisWk, -7*wk);
    const prog = 7 - wk;
    plan.forEach((p,i) => {
      const date = addDays(base, p.d);
      if (date > today()) return;
      if ((wk + i) % 5 === 4) return; // skipped sessions
      out.push({ id:uid(), date, muscle:p.m, exercise:p.ex,
        sets: Math.max(2, p.sets + (prog > 3 && i % 2 ? 1 : 0) - (wk === 4 ? 1 : 0)),
        reps: p.reps, weight: p.w + prog*(p.w > 100 ? 5 : 2.5) });
    });
  }
  return out;
}

/* ---------- helpers: periods, exercises, files ---------- */
const mStart = s => s.slice(0, 7) + '-01';
const mAdd = (k, n) => { const [y, m] = k.split('-').map(Number); return toStr(new Date(y, m - 1 + n, 1)); };
const pStart = (mode, s) => mode === 'week' ? weekStart(s) : mStart(s);
const pAdd = (mode, k, n) => mode === 'week' ? addDays(k, 7 * n) : mAdd(k, n);
const pEnd = (mode, k) => mode === 'week' ? addDays(k, 6) : addDays(mAdd(k, 1), -1);
const daysIn = k => { const [y, m] = k.split('-').map(Number); return new Date(y, m, 0).getDate(); };
const monthName = k => { const [y, m] = k.split('-').map(Number); return `${MON[m - 1]} ${y}`; };
const daysBetween = (a, b) => Math.round((fromStr(b) - fromStr(a)) / 86400000);
const ago = s => { const d = daysBetween(s, today()); return d <= 0 ? 'today' : d === 1 ? 'yesterday' : d < 14 ? `${d} days ago` : `${Math.round(d / 7)} weeks ago`; };

const norm = s => s.trim().toLowerCase();
const rowText = r => `${r.sets}×${r.reps}${r.weight ? ` @ ${r.weight}${r.mult === 2 ? '/side' : ''}` : ''}`;
const e1rm = (w, r) => w > 0 ? (r <= 1 ? w : w * (1 + r / 30)) : 0;   // Epley estimate

// One option per distinct exercise: latest muscle, last session's rows, how often logged
function buildIndex(entries) {
  const m = new Map();
  entries.forEach(e => {
    const k = norm(e.exercise);
    let o = m.get(k);
    if (!o) { o = { name:e.exercise, muscle:e.muscle, last:null, lastDate:'', count:0 }; m.set(k, o); }
    o.count++;
    if (e.date >= o.lastDate) {
      if (e.date > o.lastDate) o.last = [];
      o.lastDate = e.date; o.last.push(e); o.name = e.exercise; o.muscle = e.muscle;
    }
  });
  MUSCLES.forEach(mu => mu.ex.forEach(n => { const k = norm(n); if (!m.has(k)) m.set(k, { name:n, muscle:mu.id, last:null, lastDate:'', count:0 }); }));
  return [...m.values()];
}

// Most recent session for an exercise; `before` limits it to dates earlier than that day
function lastSession(entries, name, before) {
  const k = norm(name); if (!k) return null;
  let best = '';
  entries.forEach(e => { if (norm(e.exercise) === k && (!before || e.date < before) && e.date > best) best = e.date; });
  if (!best) return null;
  return { date:best, rows: entries.filter(e => norm(e.exercise) === k && e.date === best) };
}

function bests(entries, name) {
  const k = norm(name); let w = 0, e = 0, n = 0;
  entries.forEach(x => { if (norm(x.exercise) === k) { n++; w = Math.max(w, x.weight); e = Math.max(e, e1rm(x.weight, x.reps)); } });
  return { w, e, n };
}

const csvCell = v => { const s = String(v); return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
function toCsv(entries, unit) {
  const head = ['date', 'muscle', 'exercise', 'sets', 'reps', 'weight', 'unit', 'per_side', 'volume'];
  const rows = [...entries].sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0)
    .map(e => [e.date, e.muscle, e.exercise, e.sets, e.reps, e.weight, unit, e.mult === 2 ? 'yes' : 'no', e.sets * e.reps * e.weight * (e.mult || 1)]);
  return '\uFEFF' + [head, ...rows].map(r => r.map(csvCell).join(',')).join('\r\n');
}

// Opens the iOS share sheet (Save to Files, AirDrop...) where supported, otherwise downloads
async function saveFile(filename, text, mime) {
  const file = new File([text], filename, { type: mime });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: filename }); return 'shared'; }
    catch (e) { if (e && e.name === 'AbortError') return 'cancelled'; }
  }
  const url = URL.createObjectURL(new Blob([text], { type: mime }));
  const a = document.createElement('a');
  a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
  return 'downloaded';
}

/* ---------- small components ---------- */
function Delta({ cur, prev }) {
  const d = cur - prev;
  if (cur === 0 && prev === 0) return <small className="flat">–</small>;
  if (d === 0) return <small className="flat">even</small>;
  return <small className={d > 0 ? 'up' : 'down'}>{d > 0 ? '▲' : '▼'} {fmt(Math.abs(d))}</small>;
}

function Spark({ values, color }) {
  const w = 56, h = 24, max = Math.max(...values, 1);
  const pts = values.map((v,i) => [ (i/(values.length-1))*(w-6)+3, h-3 - (v/max)*(h-6) ]);
  return (
    <svg width={w} height={h} viewBox={`0 0 ${w} ${h}`} aria-hidden="true">
      <polyline points={pts.map(p=>p.join(',')).join(' ')} fill="none" stroke={color} strokeWidth="2" strokeLinejoin="round" strokeLinecap="round"/>
      <circle cx={pts[pts.length-1][0]} cy={pts[pts.length-1][1]} r="3" fill={color}/>
    </svg>
  );
}


function BarChart({ data, ma, est, color }) {
  const W = 340, H = 160, top = 22, bottom = 22;
  const n = data.length + (est ? 1 : 0);
  const maxV = Math.max(1, ...data.map(d => d.value), ...(ma || []).map(v => v == null ? 0 : v), est ? est.value : 0);
  const slot = W / n, bw = slot * 0.62;
  const cx = i => i * slot + slot / 2;
  const hOf = v => (v / maxV) * (H - top - bottom);
  const yOf = v => H - bottom - hOf(v);
  const line = (ma || []).map((v, i) => v == null ? null : [cx(i), yOf(v)]).filter(Boolean);
  const ei = data.length;
  return (
    <svg viewBox={`0 0 ${W} ${H}`} width="100%" role="img" aria-label="Volume trend chart">
      <line x1="0" x2={W} y1={H - bottom} y2={H - bottom} stroke="var(--line)" strokeWidth="1"/>
      {data.map((d, i) => {
        const bh = Math.max(d.value > 0 ? 3 : 0, hOf(d.value));
        const x = cx(i) - bw / 2, y = H - bottom - bh;
        return (
          <g key={d.start}>
            <rect x={x} y={y} width={bw} height={bh} rx="3" fill={d.sel ? color : 'var(--steel-soft)'} opacity={d.partial ? 0.55 : 1}/>
            {d.sel && <rect x={x} y={H - bottom + 3} width={bw} height="3" rx="1.5" fill="var(--collar)"/>}
            <text x={cx(i)} y={y - 5} textAnchor="middle" fontSize="14" fontWeight="600" fill="var(--ink)">{d.value ? fmt(d.value) : ''}</text>
            <text x={cx(i)} y={H - 6} textAnchor="middle" fontSize="12" fill={d.sel ? 'var(--ink)' : 'var(--muted)'} fontWeight={d.sel ? 700 : 500}>{d.tick}</text>
          </g>
        );
      })}
      {est && (
        <g>
          <rect x={cx(ei) - bw / 2} y={yOf(est.value)} width={bw} height={Math.max(3, hOf(est.value))} rx="3" fill="none" stroke="var(--ink)" strokeWidth="1.5" strokeDasharray="4 3"/>
          <text x={cx(ei)} y={yOf(est.value) - 5} textAnchor="middle" fontSize="14" fontWeight="600" fill="var(--ink)">{fmt(est.value)}</text>
          <text x={cx(ei)} y={H - 6} textAnchor="middle" fontSize="12" fontWeight="700" fill="var(--ink)">Est.</text>
        </g>
      )}
      {line.length > 1 && <polyline points={line.map(p => p.join(',')).join(' ')} fill="none" stroke="var(--ink)" strokeWidth="2" strokeLinejoin="round" strokeLinecap="round"/>}
      {line.map((p, i) => <circle key={i} cx={p[0]} cy={p[1]} r="3.5" fill="var(--card)" stroke="var(--ink)" strokeWidth="2"/>)}
    </svg>
  );
}

function LineChart({ pts, color }) {
  const W = 340, H = 170, top = 26, bottom = 24, padX = 22;
  if (!pts.length) return null;
  const vals = pts.map(p => p.value);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if (hi === lo) { lo = Math.max(0, lo * 0.9); hi = hi * 1.1 + 1; }
  else { const pad = (hi - lo) * 0.2; lo = Math.max(0, lo - pad); hi += pad; }
  const x = i => pts.length === 1 ? W / 2 : padX + (i / (pts.length - 1)) * (W - 2 * padX);
  const y = v => H - bottom - ((v - lo) / (hi - lo)) * (H - top - bottom);
  const labelAt = new Set([0, pts.length - 1, Math.floor((pts.length - 1) / 2)]);
  return (
    <svg viewBox={`0 0 ${W} ${H}`} width="100%" role="img" aria-label="Exercise progress chart">
      <line x1="0" x2={W} y1={H - bottom} y2={H - bottom} stroke="var(--line)" strokeWidth="1"/>
      {pts.length > 1 && <polyline points={pts.map((p, i) => `${x(i)},${y(p.value)}`).join(' ')} fill="none" stroke={color} strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round"/>}
      {pts.map((p, i) => (
        <g key={i}>
          <circle cx={x(i)} cy={y(p.value)} r={p.pr ? 6 : 3.5} fill={p.pr ? 'var(--collar)' : color} stroke={p.pr ? 'var(--ink)' : 'none'} strokeWidth="1.5"/>
          {(p.pr || i === pts.length - 1) && <text x={x(i)} y={y(p.value) - 11} textAnchor="middle" fontSize="14" fontWeight="600" fill="var(--ink)">{fmt(p.value)}</text>}
          {labelAt.has(i) && <text x={x(i)} y={H - 6} textAnchor="middle" fontSize="12" fill="var(--muted)">{p.label}</text>}
        </g>
      ))}
    </svg>
  );
}

/* ---------- Dashboard ---------- */
function Dashboard({ entries, prefs, setPrefs, goLog, goSettings, loadSample, backup }) {
  const [mode, setMode] = useState('week');
  const [offset, setOffset] = useState(0);
  const [filter, setFilter] = useState(null);
  const metric = prefs.metric;
  const isWeek = mode === 'week';
  const unitW = isWeek ? 'week' : 'month';
  const shown = isWeek ? 8 : 6;
  const wins = isWeek ? [4, 8, 12] : [3, 6, 12];
  const maN = prefs.ma[mode] || 0;
  const curKey = pStart(mode, today());
  const selKey = pAdd(mode, curKey, offset);
  const inProg = selKey >= curKey;
  const prevKey = pAdd(mode, selKey, -1);

  const agg = useMemo(() => {
    const a = {};
    entries.forEach(e => {
      const k = pStart(mode, e.date);
      a[k] = a[k] || {};
      a[k][e.muscle] = (a[k][e.muscle] || 0) + valueOf(e, metric);
    });
    return a;
  }, [entries, metric, mode]);
  const firstKey = useMemo(() => {
    if (!entries.length) return curKey;
    const min = entries.reduce((m, e) => e.date < m ? e.date : m, entries[0].date);
    const k = pStart(mode, min);
    // A partial first month would drag averages down, so averaging starts the month after
    return (mode === 'month' && min.slice(8) > '07') ? pAdd(mode, k, 1) : k;
  }, [entries, mode, curKey]);

  const get = (k, m) => (agg[k] && agg[k][m]) || 0;
  const total = k => MUSCLES.reduce((s, m) => s + get(k, m.id), 0);
  const val = k => filter ? get(k, filter) : total(k);

  // Average of up to n completed periods ending at k (the in-progress period is never included)
  const maAt = (k, n) => {
    if (!n || k >= curKey || k < firstKey) return null;
    let p = pAdd(mode, k, -(n - 1)); if (p < firstKey) p = firstKey;
    let sum = 0, cnt = 0;
    for (; p <= k; p = pAdd(mode, p, 1)) { sum += val(p); cnt++; }
    return cnt >= 2 ? { v: sum / cnt, cnt } : null;
  };

  const keys = Array.from({ length: shown }, (_, i) => pAdd(mode, selKey, -(shown - 1 - i)));
  const chartData = keys.map(k => ({ start:k, value:val(k), sel:k === selKey, partial:k >= curKey, tick: isWeek ? tick(k) : MON[+k.slice(5, 7) - 1] }));
  const maSeries = maN ? keys.map(k => { const r = maAt(k, maN); return r ? r.v : null; }) : null;
  const lastDone = inProg ? prevKey : selKey;
  const estimate = maN ? maAt(lastDone, maN) : null;

  const rows = MUSCLES.map(m => ({ ...m, cur:get(selKey, m.id), prev:get(prevKey, m.id), series:keys.map(k => get(k, m.id)) }));
  const maxCur = Math.max(...rows.map(r => r.cur), 0);
  const factor = isWeek ? 1 : daysIn(selKey) / 7;
  const targets = prefs.targets || {};
  const tgt = id => metric === 'sets' && targets[id] > 0 ? targets[id] * factor : 0;
  const maxTgt = Math.max(0, ...MUSCLES.map(m => tgt(m.id)));
  const anyTarget = maxTgt > 0;
  const scale = metric === 'sets' ? Math.max(1, maxCur, maxTgt * 1.3, 20 * factor) : Math.max(1, maxCur);

  const curV = val(selKey), prevV = val(prevKey);
  const unitLabel = metric === 'sets' ? 'sets' : prefs.unit;

  if (entries.length === 0) {
    return (
      <div className="card empty">
        <h2>No sets logged yet</h2>
        <div>Log your first sets, or load sample data to see how the trends look.</div>
        <div style={{display:'flex',gap:10,justifyContent:'center',flexWrap:'wrap'}}>
          <button className="ghost" onClick={goLog}>Log sets</button>
          <button className="ghost" onClick={loadSample}>Load sample data</button>
        </div>
      </div>
    );
  }

  const navLabel = offset === 0 ? `This ${unitW} · in progress` : offset === -1 ? `Last ${unitW}` : `${-offset} ${unitW}s ago`;

  return (
    <div>
      {backup.needed && (
        <div className="card banner" role="alert">
          <b>Back up your log</b>
          <div className="note" style={{margin:'2px 0 0'}}>{backup.text}</div>
          <div className="brow">
            <button className="btn-sm go" onClick={backup.run}>Back up now</button>
            <button className="btn-sm" onClick={backup.later}>Remind me later</button>
          </div>
        </div>
      )}

      <div className="ctrl">
        <div className="seg" role="group" aria-label="Period">
          {['week', 'month'].map(m => <button key={m} className={mode === m ? 'on' : ''} onClick={() => { setMode(m); setOffset(0); }}>{m === 'week' ? 'Week' : 'Month'}</button>)}
        </div>
        <div className="seg" role="group" aria-label="Moving average">
          <span className="seglabel">Avg</span>
          {[0, ...wins].map(w => <button key={w} className={maN === w ? 'on' : ''} onClick={() => setPrefs({ ...prefs, ma:{ ...prefs.ma, [mode]: w } })}>{w === 0 ? 'Off' : w}</button>)}
        </div>
      </div>

      <div className="weeknav">
        <button className="nav" aria-label={`Previous ${unitW}`} onClick={() => setOffset(offset - 1)}>‹</button>
        <button className="label" onClick={() => setOffset(0)}>
          <b>{isWeek ? `${short(selKey)} – ${short(pEnd(mode, selKey))}` : monthName(selKey)}</b>
          <span>{navLabel}{offset !== 0 ? ` · tap for this ${unitW}` : ''}</span>
        </button>
        <button className="nav" aria-label={`Next ${unitW}`} disabled={offset >= 0} onClick={() => setOffset(offset + 1)}>›</button>
      </div>

      <div className="card">
        <div className="headline">
          <span className="num big">{fmt(curV)}</span>
          <span className="unit">{unitLabel} · {filter || 'all muscles'}{inProg ? ' so far' : ''}</span>
        </div>
        <div className="sub">
          {prevV === 0 && curV === 0 ? `Nothing logged this ${unitW}` :
            <span>vs prior {unitW}: <b className={curV > prevV ? 'up' : curV < prevV ? 'down' : 'flat'}>
              {curV === prevV ? 'no change' : `${curV > prevV ? '+' : '−'}${fmt(Math.abs(curV - prevV))}${prevV > 0 ? ` (${curV > prevV ? '+' : '−'}${Math.round(Math.abs(curV - prevV) / prevV * 100)}%)` : ''}`}
            </b></span>}
        </div>
        {maN > 0 && (
          <div className="sub" style={{marginTop:-4}}>
            {estimate
              ? <span>Next {unitW} estimate: <b>{fmt(estimate.v)} {unitLabel}</b> {estimate.cnt < maN ? `(from ${estimate.cnt} ${unitW}s)` : `(${maN}-${unitW} average)`}</span>
              : `Estimate needs at least 2 completed ${unitW}s of data.`}
          </div>
        )}
        <BarChart data={chartData} ma={maSeries} est={estimate ? { value: estimate.v } : null} color={filter ? MCOLOR[filter] : 'var(--steel)'} />
        <div className="legend">
          {maN > 0 ? `Line: ${maN}-${unitW} average of completed ${unitW}s. ` : ''}
          {estimate ? 'Dashed bar: estimate. ' : ''}
          {inProg ? `Lighter bar: ${unitW} in progress. ` : ''}
          {filter ? 'Tap the highlighted muscle again to show all.' : 'Tap a muscle below to see only its trend.'}
        </div>
      </div>

      <div className="card" style={{paddingTop:6,paddingBottom:6}}>
        <div className="rows">
          {rows.map(r => {
            const t = tgt(r.id);
            let status = null, cls = '';
            if (t) {
              if (r.cur < t) { status = `${fmt(Math.ceil(t - r.cur))} ${inProg ? 'to go' : 'short'}`; cls = 'under'; }
              else if (r.cur <= t * 1.25) { status = 'On target'; cls = 'on'; }
              else { status = `+${fmt(Math.round(r.cur - t))} over`; cls = 'over'; }
            }
            const tickAt = t || (metric === 'sets' ? 10 * factor : 0);
            return (
              <button key={r.id} className={'row' + (filter === r.id ? ' sel' : '')} onClick={() => setFilter(filter === r.id ? null : r.id)} aria-pressed={filter === r.id}>
                <div>
                  <div className="name"><span className="dot" style={{background:r.color}}/>{r.id}{status && <span className={'status ' + cls}>{status}</span>}</div>
                  <div className="track">
                    <div className="fill" style={{width: Math.min(100, r.cur / scale * 100) + '%', background: cls === 'on' ? 'var(--up)' : cls === 'over' ? 'var(--collar)' : undefined}}/>
                    {tickAt > 0 && <div className="tick" style={{left: Math.min(100, tickAt / scale * 100) + '%'}}/>}
                  </div>
                </div>
                <Spark values={r.series} color={r.color}/>
                <div className="val"><span className="num">{fmt(r.cur)}</span><Delta cur={r.cur} prev={r.prev}/></div>
              </button>
            );
          })}
        </div>
        {metric === 'sets' && (
          <div className="legend" style={{paddingBottom:8}}>
            {anyTarget ? 'Ticks mark your targets. Green is on target (up to 25% above), gold is over.' : `Ticks mark 10 sets a week${isWeek ? '' : ' (scaled to the month)'}.`}{' '}
            <button className="linkbtn" style={{padding:0,minHeight:0}} onClick={goSettings}>{anyTarget ? 'Edit targets' : 'Set weekly targets'}</button>
          </div>
        )}
      </div>
    </div>
  );
}

/* ---------- Stepper input ---------- */
function Stepper({ label, value, onChange, step, min=0, showLabel=true }) {
  const n = parseFloat(value);
  const bump = d => { const base = isNaN(n) ? 0 : n; onChange(String(Math.max(min, Math.round((base+d)*100)/100))); };
  return (
    <div>
      {showLabel && <label className="f">{label}</label>}
      <div className="step">
        <button type="button" aria-label={`Decrease ${label}`} onClick={() => bump(-step)}>−</button>
        <input inputMode="decimal" value={value} onChange={e => onChange(e.target.value)} aria-label={label}/>
        <button type="button" aria-label={`Increase ${label}`} onClick={() => bump(step)}>+</button>
      </div>
    </div>
  );
}

      </button>
